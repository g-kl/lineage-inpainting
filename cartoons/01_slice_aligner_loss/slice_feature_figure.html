<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MRCA feature distributions from observed tree nodes</title>
  <script>
    window.MathJax = {
      tex: { inlineMath: [['\\(', '\\)'], ['$', '$']] },
      svg: { fontCache: 'global' },
      startup: { typeset: true }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  <style>
    :root {
      --ink: #202124;
      --muted: #667085;
      --paper: #ffffff;
      --panel: #ffffff;
      --edge: #d7dce4;
      --edge-light: #d7dce4;
      --line: #7f8794;
    }

    html,
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .figure {
      position: relative;
      width: 1800px;
      height: 1180px;
      overflow: hidden;
      background: #ffffff;
    }

    svg.canvas {
      position: absolute;
      inset: 0;
      width: 1800px;
      height: 1180px;
    }

    .math {
      position: absolute;
      color: var(--ink);
      font-size: 31px;
      line-height: 1;
      pointer-events: none;
    }

    .math.small { font-size: 25px; }
    .math.tiny { font-size: 22px; color: var(--muted); }
    .math.large { font-size: 39px; }
    .math.xlarge { font-size: 82px; }
    .math.pt {
      padding: 0;
    }

    .math mjx-container svg {
      position: static;
      width: auto;
      height: auto;
    }

    .panel {
      fill: var(--panel);
      stroke: #d9dde5;
      stroke-width: 1.5;
    }

    .time-band {
      opacity: 1;
    }

    .time-band.t { fill: #f1edff; }
    .time-band.l { fill: #fff1df; }

    .time-line {
      stroke: var(--line);
      stroke-width: 2;
      stroke-dasharray: 7 12;
      opacity: 1;
    }

    .edge {
      fill: none;
      stroke: var(--edge);
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 1;
    }

    .edge.light {
      stroke: var(--edge);
      stroke-width: 3.5;
      opacity: 1;
    }

    .edge.future {
      stroke: var(--edge);
      stroke-width: 3.5;
      opacity: 1;
    }

    .node {
      stroke: rgba(255, 255, 255, 0.98);
      stroke-width: 4;
    }

    .matrix-row {
      stroke: #edf0f4;
      stroke-width: 1.2;
    }

    .bracket {
      fill: none;
      stroke: #4b5563;
      stroke-width: 2.2;
      stroke-linecap: round;
    }

    .slice-arrow {
      fill: none;
      stroke: var(--line);
      stroke-width: 1.9;
      stroke-linecap: round;
      stroke-linejoin: round;
      marker-end: url(#arrowhead);
      opacity: 1;
    }

    .arrowhead {
      fill: var(--line);
      opacity: 1;
    }

    .math.op { font-size: 76px; }
    .math.delim { font-size: 35.4px; }
    .math.comma { font-size: 58px; }
  </style>
</head>
<body>
<div class="figure" id="figure">
  <svg class="canvas" viewBox="0 0 1800 1180" role="img" aria-label="MRCA feature distributions assembled from observed branch and leaf nodes">
    <defs>
      <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto">
        <path class="arrowhead" d="M 0 0 L 8 4 L 0 8 z"></path>
      </marker>
    </defs>

    <rect x="0" y="0" width="1800" height="1180" fill="transparent"></rect>
    <rect class="panel" x="250" y="68" width="740" height="750" rx="10"></rect>
    <rect class="panel" x="1010" y="68" width="700" height="750" rx="10"></rect>
    <rect class="panel" x="250" y="870" width="1460" height="232" rx="10"></rect>

    <rect class="time-band t" x="294" y="352" width="676" height="40" rx="20"></rect>
    <line class="time-line" x1="294" y1="372" x2="970" y2="372"></line>
    <rect class="time-band l" x="377" y="642" width="284" height="40" rx="20"></rect>
    <line class="time-line" x1="294" y1="662" x2="970" y2="662"></line>

    <line class="time-line" x1="1030" y1="372" x2="1680" y2="372"></line>
    <line class="time-line" x1="1030" y1="662" x2="1680" y2="662"></line>

    <g id="tree-r" transform="translate(170 0)"></g>
    <g id="tree-rp"></g>

    <line class="slice-arrow" x1="519" y1="372" x2="519" y2="315"></line>
    <line class="slice-arrow" x1="430" y1="662" x2="430" y2="590"></line>
    <line class="slice-arrow" x1="608" y1="662" x2="608" y2="630"></line>

    <g id="matrix-r"></g>
    <g id="matrix-rp"></g>
  </svg>

  <div class="math large" style="left: 558px; top: 84px;">\(\mathcal T_r\)</div>
  <div class="math large" style="left: 1268px; top: 84px;">\(\mathcal T_{r'}\)</div>

  <div class="math tiny" style="left: 1728px; top: 364px;">\(t\)</div>
  <div class="math tiny" style="left: 1728px; top: 654px;">\(t+\ell\)</div>

  <div class="math small pt" id="label-m" style="left: 541px; top: 288px;">\(m\)</div>
  <div class="math small pt" id="label-u" style="left: 387px; top: 563px;">\(u\)</div>
  <div class="math small pt" id="label-v" style="left: 636px; top: 603px;">\(v\)</div>

  <div class="math small" style="left: 20px; top: 354px; width: 208px; text-align: right;">\(\mathcal G_t(\mathcal T_r;1)\)</div>
  <div class="math small" style="left: 20px; top: 644px; width: 208px; text-align: right;">\(\mathcal G_{t+\ell}(\mathcal T_m;2)\)</div>
  <div class="math op" style="left: 410px; top: 948px;">\(D\)</div>
  <div class="math delim" style="left: 528px; top: 922px;">\(\Bigg(\)</div>
  <div class="math comma" style="left: 970px; top: 1004px;">\(,\)</div>
  <div class="math delim" style="left: 1400px; top: 922px;">\(\Bigg)\)</div>
  <div class="math small" style="left: 570px; top: 1058px; width: 250px; text-align: center;">\(P_{r,\mathrm{mrca},h}\)</div>
  <div class="math small" style="left: 1140px; top: 1058px; width: 250px; text-align: center;">\(P_{r',\mathrm{mrca},h}\)</div>
</div>

<script>
(() => {
  const NS = 'http://www.w3.org/2000/svg';
  const svg = document.querySelector('svg.canvas');
  const T_SLICE = 1.55;
  const L_SLICE = 3.55;
  const B = 8;

  const records = {
    r: {
      group: '#tree-r',
      highlight: { m: 'rA', u: 'rA1', v: 'rA2' },
      nodes: [
        { id: 'r0', parent: null, time: 0, x: 462, y: 150, color: '#5146a6', kind: 'branch' },
        { id: 'rA', parent: 'r0', time: 0.92, x: 349, y: 300, color: '#6b5ed8', kind: 'branch' },
        { id: 'rB', parent: 'r0', time: 1.18, x: 635, y: 342, color: '#8d80e6', kind: 'branch' },
        { id: 'rA1', parent: 'rA', time: 2.42, x: 260, y: 575, color: '#c95f45', kind: 'branch' },
        { id: 'rA2', parent: 'rA', time: 2.72, x: 438, y: 615, color: '#d89436', kind: 'branch' },
        { id: 'rB1', parent: 'rB', time: 2.28, x: 560, y: 545, color: '#9f9a3d', kind: 'branch' },
        { id: 'rB2', parent: 'rB', time: 2.66, x: 690, y: 600, color: '#4f9a66', kind: 'branch' },
        { id: 'rB3', parent: 'rB', time: 3.00, x: 770, y: 635, color: '#2f8fa4', kind: 'branch' }
      ]
    },
    rp: {
      group: '#tree-rp',
      nodes: [
        { id: 'p0', parent: null, time: 0, x: 1338, y: 150, color: '#5146a6', kind: 'branch' },
        { id: 'pA', parent: 'p0', time: 0.78, x: 1195, y: 278, color: '#6b5ed8', kind: 'branch' },
        { id: 'pB', parent: 'p0', time: 1.05, x: 1380, y: 322, color: '#7b70df', kind: 'branch' },
        { id: 'pC', parent: 'p0', time: 1.30, x: 1570, y: 342, color: '#988ce9', kind: 'branch' },
        { id: 'pA1', parent: 'pA', time: 2.12, x: 1076, y: 525, color: '#c95f45', kind: 'branch' },
        { id: 'pA2', parent: 'pA', time: 2.78, x: 1250, y: 615, color: '#d89436', kind: 'branch' },
        { id: 'pB1', parent: 'pB', time: 2.46, x: 1340, y: 568, color: '#9f9a3d', kind: 'branch' },
        { id: 'pB2', parent: 'pB', time: 2.92, x: 1438, y: 628, color: '#4f9a66', kind: 'branch' },
        { id: 'pC1', parent: 'pC', time: 2.30, x: 1540, y: 545, color: '#2f8fa4', kind: 'branch' },
        { id: 'pC2', parent: 'pC', time: 3.06, x: 1640, y: 638, color: '#4677b8', kind: 'branch' }
      ]
    }
  };

  const futureBranchOffsets = {
    r: {
      rA1: [[-28, 96], [30, 104]],
      rA2: [[-26, 82], [28, 90]],
      rB1: [[-22, 92], [25, 102]],
      rB2: [[-24, 82], [26, 92]],
      rB3: [[-26, 76], [25, 84]]
    },
    rp: {
      pA1: [[-28, 100], [30, 110]],
      pA2: [[-25, 82], [28, 92]],
      pB1: [[-24, 88], [26, 98]],
      pB2: [[-26, 76], [26, 84]],
      pC1: [[-24, 92], [26, 102]],
      pC2: [[-24, 76], [26, 84]]
    }
  };

  function el(tag, attrs = {}, parent = svg) {
    const node = document.createElementNS(NS, tag);
    for (const [key, value] of Object.entries(attrs)) {
      node.setAttribute(key, value);
    }
    parent.appendChild(node);
    return node;
  }

  function index(record) {
    const byId = new Map(record.nodes.map(node => [node.id, node]));
    const children = new Map(record.nodes.map(node => [node.id, []]));
    for (const node of record.nodes) {
      if (node.parent) children.get(node.parent).push(node.id);
    }
    return { byId, children };
  }

  function curve(a, b) {
    const mid = (a.y + b.y) / 2;
    return `M ${a.x} ${a.y} C ${a.x} ${mid}, ${b.x} ${mid}, ${b.x} ${b.y}`;
  }

  function drawEdge(a, b, parent, className = 'edge') {
    return el('path', { class: className, d: curve(a, b) }, parent);
  }

  function drawPath(record, fromId, toId, className) {
    const { byId } = index(record);
    const chain = [];
    let current = byId.get(toId);
    while (current && current.id !== fromId) {
      chain.push(current.id);
      current = current.parent ? byId.get(current.parent) : null;
    }
    if (!current) return;
    chain.push(fromId);
    chain.reverse();
    const group = document.querySelector(record.group);
    for (let i = 0; i < chain.length - 1; i += 1) {
      drawEdge(byId.get(chain[i]), byId.get(chain[i + 1]), group, className);
    }
  }

  function drawTree(record, highlight) {
    const group = document.querySelector(record.group);
    const { byId } = index(record);

    for (const node of record.nodes) {
      if (!node.parent) continue;
      const parent = byId.get(node.parent);
      const light = parent.id.endsWith('B') || parent.id.endsWith('C') || node.id.endsWith('B') || node.id.endsWith('C');
      const edgeClass = node.kind === 'future' ? 'edge future' : light ? 'edge light' : 'edge';
      drawEdge(parent, node, group, edgeClass);
    }

    for (const node of record.nodes) {
      if (node.kind === 'future') continue;
      const radius = node.kind === 'leaf' ? 13 : node.time === 0 ? 12 : 15;
      el('circle', {
        class: 'node',
        cx: node.x,
        cy: node.y,
        r: radius,
        fill: node.color
      }, group);
    }
  }

  function mulberry32(seed) {
    return function rng() {
      let t = seed += 0x6D2B79F5;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  function addFutureBranches(record, offsets) {
    const byId = new Map(record.nodes.map(node => [node.id, node]));
    const futureY = 755;
    for (const [id, childOffsets] of Object.entries(offsets)) {
      const parent = byId.get(id);
      childOffsets.forEach(([dx, dy], i) => {
        record.nodes.push({
          id: `${id}F${i + 1}`,
          parent: id,
          time: L_SLICE + 0.8 + i * 0.2,
          x: parent.x + dx,
          y: futureY,
          color: '#ffffff',
          kind: 'future'
        });
      });
    }
  }

  function isDescendant(byId, node, rootId) {
    let current = node;
    while (current) {
      if (current.id === rootId) return true;
      current = current.parent ? byId.get(current.parent) : null;
    }
    return false;
  }

  function activeNodes(record, sliceTime, rootId = null) {
    const { byId, children } = index(record);
    return record.nodes.filter(node => {
      if (node.time > sliceTime) return false;
      if (rootId && !isDescendant(byId, node, rootId)) return false;
      const childIds = children.get(node.id) || [];
      return childIds.every(childId => byId.get(childId).time > sliceTime);
    });
  }

  function drawFrom(record, rng) {
    const ancestors = activeNodes(record, T_SLICE);
    const m = ancestors[Math.floor(rng() * ancestors.length)];
    const pool = activeNodes(record, L_SLICE, m.id);
    if (pool.length === 1) return { m, u: pool[0], v: pool[0] };
    const first = Math.floor(rng() * pool.length);
    let second = Math.floor(rng() * (pool.length - 1));
    if (second >= first) second += 1;
    return { m, u: pool[first], v: pool[second] };
  }

  function makeDraws(record, seed, first) {
    const rng = mulberry32(seed);
    const draws = [];
    if (first) {
      const { byId } = index(record);
      draws.push({
        m: byId.get(first.m),
        u: byId.get(first.u),
        v: byId.get(first.v)
      });
    }
    while (draws.length < B) draws.push(drawFrom(record, rng));
    return draws;
  }

  function drawBracket(parent, x, y, width, height) {
    const inset = 12;
    el('path', {
      class: 'bracket',
      d: `M ${x + inset} ${y} H ${x} V ${y + height} H ${x + inset}`
    }, parent);
    el('path', {
      class: 'bracket',
      d: `M ${x + width - inset} ${y} H ${x + width} V ${y + height} H ${x + width - inset}`
    }, parent);
  }

  function drawMatrix(selector, draws, x, y) {
    const group = document.querySelector(selector);
    const width = 250;
    const height = 122;
    drawBracket(group, x, y, width, height);
    for (let i = 1; i < B; i += 1) {
      el('line', {
        class: 'matrix-row',
        x1: x + 24,
        y1: y + i * 16,
        x2: x + width - 24,
        y2: y + i * 16
      }, group);
    }
    draws.forEach((draw, row) => {
      [draw.m, draw.u, draw.v].forEach((node, col) => {
        el('circle', {
          cx: x + 74 + col * 50,
          cy: y + 12 + row * 16,
          r: 6.8,
          fill: node.color
        }, group);
      });
    });
  }

  addFutureBranches(records.r, futureBranchOffsets.r);
  addFutureBranches(records.rp, futureBranchOffsets.rp);

  drawTree(records.r, records.r.highlight);
  drawTree(records.rp);

  const drawsR = makeDraws(records.r, 13, records.r.highlight);
  const drawsRp = makeDraws(records.rp, 29);
  drawMatrix('#matrix-r', drawsR, 570, 922);
  drawMatrix('#matrix-rp', drawsRp, 1140, 922);
})();
</script>
</body>
</html>
