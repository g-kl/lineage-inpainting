# conda env create -f environment.yml && conda activate lineage-inpainting
#
# versions are the ones the paper was run with. torch is the CUDA 13.0 build;
# for another CUDA version install torch from https://pytorch.org/get-started/locally/.
#
# not included:
#   - RAPIDS (cuml, cupy, rapids-singlecell): the few GPU-UMAP / GPU-preprocessing steps
#     marked `$GPU` in the figure concept.md files ran in a separate env (python 3.13,
#     rapids-singlecell-cu13 0.15, cuml 26.02, cupy 13.6).
#   - pyscipopt: only for re-solving the theory figure's exact optimum
#     (analysis/figures/theory/depth2.py).
name: lineage-inpainting
channels:
  - defaults
dependencies:
  - python=3.14.3
  - faiss-gpu=1.12.0
  - pyyaml=6.0.3
  - jupyter
  - ipywidgets
  - pip
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu130
      - torch==2.10.0
      - numpy==2.3.5
      - scipy==1.17.1
      - pandas==2.3.3
      - networkx==3.6.1
      - h5py==3.16.0
      - anndata==0.12.10
      - treedata==0.2.4
      - scanpy==1.12
      - scvi-tools==1.4.2
      - lightning==2.6.1
      - scikit-learn==1.8.0
      - umap-learn==0.5.11
      - hydra-core==1.3.2
      - omegaconf==2.3.0
      - hydra-submitit-launcher==1.2.0
      - hydra-joblib-launcher==1.2.0
      - submitit==1.5.4
      - geomloss==0.2.6
      - pot==0.9.6.post1
      - jax[cuda13]==0.9.2
      - flax==0.12.6
      - optax==0.2.8
      - ott-jax==0.6.0
      - moscot==0.5.0
      - cloudpickle==3.1.2
      - tqdm==4.67.3
      - matplotlib==3.10.8
      - seaborn==0.13.2
      - pillow==12.0.0
      - cairosvg==2.9.0
      - playwright==1.60.0
