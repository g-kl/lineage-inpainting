_target_: splitters.bridge_tree_flow.BridgeTreeFlow

# Non-delta (absolute-frame) ambient BridgeTreeFlow with a variance-preserving SDE
# bridge -- the non-residual counterpart to bridge_delta_tree_flow_vpsde.
# Mirrors bridge_tree_flow.yaml (CFM) but with VPSDE bridge geometry.
dim: 50
d_internal: 128
n_heads: 4
n_layers: 4
hidden: 512
n_flow_steps: 8
attention_bias_init: 0.0
slice_direction: up
bridge:
  _target_: splitters.bridges.vpsde.DiffusionBridge
  beta_min: 0.1
  beta_max: 20.0
