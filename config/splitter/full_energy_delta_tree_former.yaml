_target_: splitters.tree_former.FullEnergyDeltaTreeFormer

# "Full" distributional one-step residual-frame tree predictor: the Delta
# baseline and role embedding of DeltaTreeFormer, trained with the conditional
# energy score instead of MSE. The M energy samples come from M *independent
# full forward passes* on freshly resampled masked-node input noise, so the
# noise routes through the whole transformer (attention included) -- M encodes
# per step.
# Standard Euclidean energy score: beta = 1 (L2 norm), lam = 1 (strictly proper).
dim: 50
d_internal: 128
n_heads: 4
n_layers: 4
hidden: 512
attention_bias_init: 0.0
slice_direction: up
n_energy_samples: 8
energy_beta: 1.0
energy_lam: 1.0
