# Slice-feature aligner: reference-bank marginal + root-to-leaf path on the
# shared slice primitive (aligners/slice.py). Path-only variant for comparison
# with slice_marginal_ca (CA-only) and slice_marginal_ca_path (CA + path).
#   - path: one lineage from the earliest grid time through every later grid
#     time (root-to-leaf), a single stratum -- never starts at an interior slice.
_target_: aligners.stratified.StratifiedFeatureAligner

loss: "energy"
p: 2
min_samples: 8

features:
  - _target_: aligners.stratified.TimeMarginalFeature
    n_reference_samples: 4096
    skip_observed: true
    time_tolerance: null

  - _target_: aligners.slice.PathFeature
    time_bins: [7.0, 7.5, 8.0, 8.5, 9.0, 9.5, 10.0]
    n_samples: 16
    representation: states

weights: [1.0, 1.0]
