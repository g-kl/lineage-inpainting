# @package hydra.launcher
_target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher

# Slurm configuration
partition: bates
gpus_per_node: 1
cpus_per_task: 8
mem_gb: 128
timeout_min: 1440

submitit_folder: ${hydra.sweep.dir}/.submitit/%j
array_parallelism: 2  # Maximum number of concurrent jobs
nodes: 1
tasks_per_node: 1
max_num_timeout: 3
