# @package hydra.launcher
#
# FASRC Kempner cluster launcher. Mirrors `lids` but targets the `kempner`
# partition, which requires the kempner-prefixed account. A100-40GB nodes
# (4 GPUs/node); use `kempner_requeue` for preemptible / `kempner_h100` for
# H100s. Select with `hydra/launcher=kempner` on a multirun (`-m`).
_target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher

# Slurm configuration
partition: kempner
account: kempner_mzitnik_lab
gpus_per_node: 1
cpus_per_task: 8
mem_gb: 128
timeout_min: 1440

submitit_folder: ${hydra.sweep.dir}/.submitit/%j
array_parallelism: 2  # Maximum number of concurrent jobs
nodes: 1
tasks_per_node: 1
max_num_timeout: 3
