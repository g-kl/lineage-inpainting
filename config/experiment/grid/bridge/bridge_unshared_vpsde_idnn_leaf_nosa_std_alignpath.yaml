# @package _global_
#
# Aligner ablation on vpsde + idnn_leaf: marginal + Path (slice_marginal_path).
# Adds the root-to-leaf PathFeature on top of the marginal-only baseline.
defaults:
  - override /dataset: mouse_embryo
  - override /pooler: delta_tree_former
  - override /splitter: bridge_delta_tree_flow_vpsde
  - override /aligner: slice_marginal_path
  - override /pairing: id_nn_alt
  - override /extender: conditional_graft
  - override /record_sampler: paired_offset_sample_offset
  - override /training: default

experiment_name: mouse_embryo_grid_bridge_unshared_vpsde_idnn_leaf_nosa_std_alignpath
share_pool_split: false

objective:
  split_align_weight: 0

optimizer:
  lr: 1e-3
  warmup_steps: 500
  weight_decay: 0.01
  adam_eps: 1e-6

training:
  n_steps: 20000
  log_every: 100
  save_every: 5000
  n_trees: 1024
  n_records: 2
