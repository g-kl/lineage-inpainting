# Variant of nearest_neighbor.yaml with `stop_grad: true` -- detaches the
# pool-side states before the snap, so no splitter-loss gradient reaches the
# pooler through either the snapped or the passthrough positions.
_target_: pairings.pairing.NearestNeighborPairing
time_tolerance: null
min_snap_time: null
snap_window: 1
clonal_reference: false
stop_grad: true
